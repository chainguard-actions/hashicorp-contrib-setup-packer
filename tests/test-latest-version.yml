name: Test latest Packer version (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert packer is installed
        run: |
          if ! command -v packer >/dev/null 2>&1; then
            echo "FAIL: packer not found on PATH"
            exit 1
          fi
          OUT="$(packer version 2>&1 | head -n1)"
          echo "packer version: $OUT"
          if ! echo "$OUT" | grep -qE '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: could not parse a version from packer output"
            exit 1
          fi
          echo "PASS"
