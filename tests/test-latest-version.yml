name: Test latest packer version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert packer is installed
        run: |
          if ! command -v packer >/dev/null 2>&1; then
            echo "FAIL: packer not found on PATH"
            exit 1
          fi
          ACTUAL="$(packer version | head -n1)"
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE 'Packer v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: unexpected packer version output"
            exit 1
          fi
          echo "PASS"
