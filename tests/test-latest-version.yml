name: Test latest Packer version (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert packer installed and matches latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! command -v packer >/dev/null 2>&1; then
            echo "FAIL: packer not found on PATH"
            exit 1
          fi
          OUT="$(packer version)"
          echo "packer version output: $OUT"
          if ! echo "$OUT" | grep -qE '^Packer v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: unexpected packer version output"
            exit 1
          fi
          LATEST="$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/hashicorp/packer/releases/latest | grep -m1 '"tag_name"' | sed -E 's/.*"tag_name": *"v?([^"]+)".*/\1/')"
          echo "latest release: $LATEST"
          if [ -n "$LATEST" ] && ! echo "$OUT" | grep -q "v$LATEST"; then
            echo "FAIL: installed version does not match latest release $LATEST"
            exit 1
          fi
          echo "PASS"
