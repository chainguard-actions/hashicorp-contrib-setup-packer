name: Test specific packer version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          packer-version: "1.9.4"
      - name: Assert packer is installed with requested version
        run: |
          if ! command -v packer >/dev/null 2>&1; then
            echo "FAIL: packer not found on PATH"
            exit 1
          fi
          echo "packer path: $(command -v packer)"
          ACTUAL="$(packer version | head -n1)"
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "1.9.4"; then
            echo "FAIL: expected version 1.9.4"
            exit 1
          fi
          echo "PASS"
